name: CI

# Яагаад GitHub Actions вэ:
#   DockerRuntime-ыг батлахад Docker-той Linux хост хэрэгтэй. Сервер БИШ.
#   Actions-ийн runner дээр Ubuntu + Docker бэлэн ирдэг, үнэгүй.
#   → Vultr шаардлагагүй, SSH шаардлагагүй, $0.
#
# Энэ нь интерфейсийн гол санааг ч бас батлана: runtime-ийн хост нь
# солигддог зүйл. Өнөөдөр Actions, маргааш Hetzner, дараа нь bare metal.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Docker хэрэггүй хэсэг. Хамаарал ТЭГ — npm install ч хийхгүй.
  # ─────────────────────────────────────────────────────────────────────
  logic:
    name: логик (Docker-гүй)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm test
        run: node --experimental-strip-types --test test/fake.test.ts test/preview.test.ts test/no-leak.test.ts

  # ─────────────────────────────────────────────────────────────────────
  # Типүүд
  # ─────────────────────────────────────────────────────────────────────
  types:
    name: типүүд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────
  # ЖИНХЭНЭ Docker дээрх гэрээ. Энэ л DockerRuntime-ыг 🟡-аас ✅ болгоно.
  # ─────────────────────────────────────────────────────────────────────
  docker:
    name: гэрээ (жинхэнэ Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Docker байгааг батлах
        # Хэрэв Docker байхгүй бол ЭНД унана. Чимээгүй алгасахгүй —
        # "алгасалт нь амжилт гэж уншигдах ЁСГҮЙ".
        run: docker version
      - name: тестийн образ
        run: docker pull busybox:latest
      - name: гэрээ + OOM
        # Гаралтыг ХОЁР зам руу гаргана:
        #   1. ажлын хураангуй — хүн харахад
        #   2. тэмдэглэгээ (::error::) — checks API-аар ГАДНААС уншигдана
        # Шалтгаан: GitHub-ийн лог ба хураангуй хоёулаа JS-ээр ачаалагддаг
        # тул автоматаар уншигдахгүй. Тэмдэглэгээ нь нээлттэй API-д байдаг.
        run: |
          set +e
          node --experimental-strip-types --test test/docker.test.ts 2>&1 | tee /tmp/out.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Docker гэрээний гаралт (exit=$code)"
            echo '```'
            tail -c 60000 /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          msg=$(grep -aE -A3 'not ok|error:|expected:|actual:|AssertionError|^\s*[+-] |^# (tests|pass|fail|skipped)|ХЭМЖЭЭГҮЙ' /tmp/out.txt | head -120)
          msg="${msg//'%'/%25}"
          msg="${msg//$'\n'/%0A}"
          msg="${msg//$'\r'/%0D}"
          if [ "$code" -ne 0 ]; then
            echo "::error title=docker-contract::$msg"
          else
            echo "::notice title=docker-contract-ok::$msg"
          fi
          exit $code
